name: Prepare Log Viewer Lock

on:
  push:
    branches:
      - feat/admin-log-viewer

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: feat/admin-log-viewer
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install Log Viewer dependency
        run: composer require opcodesio/log-viewer:^3.24 --no-interaction --no-scripts --no-progress

      - name: Remove temporary workflow
        run: rm .github/workflows/prepare-log-viewer-lock.yml

      - name: Commit generated dependency metadata
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.json composer.lock .github/workflows/prepare-log-viewer-lock.yml
          git commit -m "Install Log Viewer dependency [skip ci]"
          git push origin HEAD:feat/admin-log-viewer
