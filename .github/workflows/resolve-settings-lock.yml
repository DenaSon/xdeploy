name: Resolve settings lock

on:
  push:
    branches:
      - feat/settings-foundation

permissions:
  contents: write

jobs:
  lock:
    name: Resolve Composer lock
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mbstring, dom, fileinfo, gd, pdo_sqlite, sqlite3, simplexml, sodium
          tools: composer:v2

      - name: Resolve Spatie settings dependency
        run: composer update spatie/laravel-settings --with-dependencies --no-scripts --no-interaction --prefer-dist --no-progress

      - name: Validate Composer metadata
        run: composer validate

      - name: Commit composer.lock when changed
        shell: bash
        run: |
          if git diff --quiet -- composer.lock; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git commit -m "Lock Spatie Laravel Settings dependencies"
          git push origin HEAD:feat/settings-foundation
