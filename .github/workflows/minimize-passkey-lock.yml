name: Minimize Passkey Lock

on:
  push:
    branches:
      - agent/passkey-foundation

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SERVER_CREDENTIALS_KEY_V1: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      ARVAN_CLOUD_API_KEY: ci-not-a-real-arvan-key
      ZARINPAL_MERCHANT_ID: 00000000-0000-0000-0000-000000000001

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Restore baseline lock and add only Passkey dependencies
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- composer.lock
          composer update laravel/passkeys --with-dependencies --no-interaction --prefer-dist --no-progress

      - name: Commit minimal lock
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git commit -m "Minimize Passkey Composer lock"
          git push
