name: Sync Passkey Locks

on:
  push:
    branches:
      - agent/passkey-foundation

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Update Composer lock
        run: composer update laravel/passkeys --with-all-dependencies --no-interaction --prefer-dist --no-progress

      - name: Self-host EasyMDE
        run: npm install easymde@2.21.0 --save-exact

      - name: Commit generated locks
        shell: bash
        run: |
          if git diff --quiet -- composer.lock package.json package-lock.json; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock package.json package-lock.json
          git commit -m "Sync Passkey dependency locks [lock-sync]"
          git push
