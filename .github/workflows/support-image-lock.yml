name: Support image dependency lock

on:
  push:
    branches:
      - agent/support-image-attachments-phase1
    paths:
      - .github/workflows/support-image-lock.yml

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/support-image-attachments-phase1

      - name: Add Laravel image dependency
        run: composer require intervention/image:^4.0 --no-interaction --no-progress --no-scripts --no-install

      - name: Commit lock files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.json composer.lock
          git diff --cached --quiet || git commit -m "Add Laravel image processing dependency"
          git push origin HEAD:agent/support-image-attachments-phase1
