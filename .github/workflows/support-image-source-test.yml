name: Support image source test

on:
  push:
    branches:
      - agent/support-image-attachments-phase1
    paths:
      - .github/workflows/support-image-source-test.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SERVER_CREDENTIALS_KEY_V1: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      ARVAN_CLOUD_API_KEY: ci-not-a-real-arvan-key
      ZARINPAL_MERCHANT_ID: 00000000-0000-0000-0000-000000000001

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: mbstring, dom, fileinfo, gd, pdo_sqlite, sqlite3, simplexml, sodium
          tools: composer:v2

      - name: Prepare environment
        run: cp .env.example .env

      - name: Install PHP dependencies from source
        run: composer install --no-interaction --prefer-source --no-progress

      - name: Generate application key
        run: php artisan key:generate --force

      - name: Run support attachment tests
        run: php artisan test tests/Feature/Support/SupportMessageAttachmentTest.php --colors=never
